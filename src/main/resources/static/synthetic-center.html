<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>合成中心数据</title>
<style>
:root{--ink:#17212b;--muted:#617080;--line:#d8e0e7;--bg:#f4f7f9;--panel:#fff;--blue:#156f9e;--warn:#8a4e00}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif;color:var(--ink)}main{max-width:1160px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;gap:16px;align-items:start}h1{margin:0;font-size:24px}p{margin:6px 0;color:var(--muted)}.notice{margin:20px 0;padding:12px 14px;border-left:4px solid var(--warn);background:#fff7e8;color:#654000}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}button{border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:4px;cursor:pointer;color:var(--ink)}button[aria-selected="true"]{background:var(--blue);border-color:var(--blue);color:#fff}.meta{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}.tag{padding:3px 8px;border-radius:3px;background:#e5f3f8;color:#075274;font-size:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:auto}.status{padding:12px 14px;border-bottom:1px solid var(--line);color:var(--muted)}table{width:100%;border-collapse:collapse;min-width:640px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--muted);font-weight:600;background:#f8fafb}.empty{padding:28px;text-align:center;color:var(--muted)}@media(max-width:600px){main{padding:14px}header{display:block}h1{font-size:21px}.panel{margin-inline:-2px}}
</style>
</head>
<body><main>
<header><div><h1>合成中心数据</h1><p>开发期只读数据浏览页</p></div><a href="/" style="color:#156f9e">返回工作台</a></header>
<div class="notice" id="notice">正在确认数据模式。这里显示的内容不能作为真实中心数据、专业结论或验收依据。</div>
<nav class="tabs" aria-label="数据类别" id="tabs"></nav><div class="meta" id="meta"></div>
<section class="panel"><div style="display:flex;gap:10px;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap"><input id="search" type="search" placeholder="搜索当前数据" aria-label="搜索当前数据" style="padding:8px;min-width:240px;border:1px solid var(--line)"><div><button id="prev" aria-label="上一页">←</button> <span id="page">1 / 1</span> <button id="next" aria-label="下一页">→</button></div></div><div class="status" id="status">正在加载…</div><div id="content"></div></section>
</main><script>
const sources=[
 {id:'patents',label:'专利',url:'/api/v0/synthetic-center/patents',columns:['sourceId','applicationNumber','title','version']},
 {id:'trademarks',label:'商标',url:'/api/v0/synthetic-center/trademarks',columns:['sourceId','registrationNumber','name','version']},
 {id:'clues',label:'执法线索',url:'/api/v0/synthetic-center/enforcement/clues',columns:['source','missingItems','conflicts']},
 {id:'evidence',label:'执法证据',url:'/api/v0/synthetic-center/enforcement/evidence',columns:['source','relatedClueId','availability','issue']},
 {id:'cases',label:'裁决案件',url:'/api/v0/synthetic-center/adjudication/cases',columns:['kind','id','version','location']},
 {id:'materials',label:'裁决材料',url:'/api/v0/synthetic-center/adjudication/materials',columns:['source','caseRef','data']}
];let active=sources[0],allRows=[],page=1;const size=20,$=id=>document.getElementById(id),text=v=>typeof v==='object'?JSON.stringify(v):String(v??'—');
function filtered(){const q=$('search').value.trim().toLowerCase();return q?allRows.filter(row=>JSON.stringify(row).toLowerCase().includes(q)):allRows}
function renderRows(){const rows=filtered(),pages=Math.max(1,Math.ceil(rows.length/size));page=Math.min(page,pages);const shown=rows.slice((page-1)*size,page*size);$('status').textContent=`${active.label}：${rows.length} 条记录，当前显示 ${shown.length} 条`;$('page').textContent=`${page} / ${pages}`;$('prev').disabled=page===1;$('next').disabled=page===pages;$('content').innerHTML=shown.length?'<table><thead><tr>'+active.columns.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>'+shown.map(row=>'<tr>'+active.columns.map(c=>'<td>'+text(row[c])+'</td>').join('')+'</tr>').join('')+'</tbody></table>':'<div class="empty">当前筛选无数据</div>'}
function renderTabs(){ $('tabs').innerHTML=sources.map(s=>`<button data-id="${s.id}" aria-selected="${s===active}">${s.label}</button>`).join('');document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{active=sources.find(s=>s.id===b.dataset.id);page=1;$('search').value='';renderTabs();load()}) }
async function load(){ $('status').textContent='正在读取 '+active.label+'…';$('content').innerHTML='';try{const r=await fetch(active.url);if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();$('notice').textContent=data.limitation;$('meta').innerHTML=`<span class="tag">${data.dataMode}</span><span class="tag">${data.catalogVersion}</span>`;allRows=data.items||[];renderRows()}catch(e){$('status').textContent='读取失败';$('content').innerHTML='<div class="empty">接口暂不可用：'+text(e.message)+'</div>'}}
$('search').oninput=()=>{page=1;renderRows()};$('prev').onclick=()=>{page--;renderRows()};$('next').onclick=()=>{page++;renderRows()};renderTabs();load();
</script></body></html>
