<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>咨询澄清交互原型</title>
  <style>
    :root { --ink:#152842; --muted:#68798d; --line:#dce5ee; --canvas:#f4f7fb; --surface:#fff; --blue:#1558d5; --blue-soft:#edf4ff; --green:#07816f; --green-soft:#edf9f6; --amber:#a86612; --amber-soft:#fff7eb; font-family:"Microsoft YaHei UI","PingFang SC","Segoe UI",sans-serif; }
    * { box-sizing:border-box; }
    body { min-width:320px; min-height:100dvh; margin:0; color:var(--ink); background:var(--canvas); }
    button, textarea { font:inherit; }
    button { cursor:pointer; }
    .app { display:grid; min-height:100dvh; grid-template-columns:240px minmax(0,1fr); }
    .side { display:flex; flex-direction:column; min-height:100dvh; background:#fff; border-right:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:10px; height:64px; padding:0 16px; border-bottom:1px solid var(--line); font-size:16px; font-weight:750; }
    .brand-mark { display:grid; width:28px; height:28px; place-items:center; color:#fff; background:var(--blue); font-family:Georgia,serif; }
    .nav { padding:18px 8px; }
    .nav-label { display:block; padding:9px 10px 6px; color:#7a899b; font-size:11px; font-weight:700; }
    .nav-item { display:flex; align-items:center; min-height:42px; padding:0 12px; color:#52657c; border-left:3px solid transparent; font-size:14px; }
    .nav-item.active { color:var(--blue); background:var(--blue-soft); border-left-color:var(--blue); font-weight:700; }
    .main { display:flex; min-width:0; flex-direction:column; }
    .topbar { display:flex; height:58px; align-items:center; padding:0 24px; background:#fff; border-bottom:1px solid var(--line); color:var(--muted); font-size:13px; }
    .topbar strong { color:var(--ink); }
    .workspace { display:flex; width:min(100% - 48px, 1360px); height:calc(100dvh - 98px); min-height:560px; margin:20px auto; flex-direction:column; overflow:hidden; background:#fff; border:1px solid var(--line); }
    .progress { display:flex; min-height:52px; align-items:center; gap:22px; padding:0 22px; background:#f8fafc; border-bottom:1px solid var(--line); }
    .progress-title { color:var(--green); font-size:13px; font-weight:700; white-space:nowrap; }
    .steps { display:flex; flex:1; gap:22px; min-width:0; }
    .step { display:flex; align-items:center; gap:7px; color:#718296; font-size:13px; white-space:nowrap; }
    .step::before { width:7px; height:7px; border:1px solid #b7c6d3; border-radius:50%; content:""; }
    .step.done::before { background:#91b8b1; border-color:#91b8b1; }
    .step.active { color:var(--green); font-weight:700; }
    .step.active::before { background:var(--green); border-color:var(--green); box-shadow:0 0 0 4px var(--green-soft); }
    .examples { position:relative; margin-left:auto; }
    .examples > button { min-height:34px; padding:0 8px; color:var(--ink); background:transparent; border:0; font-weight:700; }
    .examples > button:hover { color:var(--blue); background:var(--blue-soft); }
    .example-panel { position:absolute; top:40px; right:0; z-index:5; display:none; width:360px; max-height:360px; padding:8px; overflow:auto; background:#fff; border:1px solid var(--line); box-shadow:0 14px 30px rgba(28,46,70,.16); }
    .example-panel.open { display:block; }
    .example-panel h2 { margin:3px 5px 9px; font-size:14px; }
    .example { display:grid; width:100%; gap:4px; padding:10px 11px; color:var(--ink); background:#fff; border:1px solid var(--line); text-align:left; }
    .example + .example { margin-top:6px; }
    .example:hover { border-color:#a8c3e6; background:var(--blue-soft); }
    .example strong { font-size:13px; }
    .example span { overflow:hidden; color:var(--muted); font-size:12px; text-overflow:ellipsis; white-space:nowrap; }
    .conversation { display:flex; min-height:0; flex:1; flex-direction:column; overflow-y:auto; padding:28px clamp(18px,4vw,48px); scrollbar-width:thin; }
    .message { max-width:900px; }
    .message + .message { margin-top:20px; }
    .message-label { margin-bottom:6px; color:var(--muted); font-size:12px; font-weight:700; }
    .message-copy { margin:0; color:#283a51; font-size:15px; line-height:1.7; }
    .user { align-self:flex-end; width:min(620px,100%); }
    .user .message-label { color:var(--blue); text-align:right; }
    .user .message-copy { padding:10px 13px; color:#173d75; background:var(--blue-soft); border-radius:8px 3px 8px 8px; }
    .clarification { width:100%; max-width:none; padding:16px; background:#fff; border:1px solid var(--line); border-left:3px solid var(--amber); }
    .clarification-head { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; }
    .eyebrow { color:var(--amber); font-size:12px; font-weight:700; }
    .clarification h1 { margin:3px 0 0; font-size:19px; }
    .status { padding:4px 8px; color:var(--amber); background:var(--amber-soft); font-size:12px; white-space:nowrap; }
    .clarification p { margin:10px 0 12px; color:#506278; font-size:14px; line-height:1.6; }
    .needs { display:flex; flex-wrap:wrap; gap:8px; }
    .need { min-height:34px; padding:0 11px; color:#586a7e; background:#fff; border:1px solid #cdd9e6; border-radius:4px; font-size:13px; }
    .need.active, .need:hover { color:var(--blue); background:var(--blue-soft); border-color:#8fafdd; }
    .need::before { margin-right:7px; color:var(--amber); content:"+"; font-weight:700; }
    .composer { flex:0 0 auto; padding:12px clamp(14px,2vw,24px) 16px; background:#fff; border-top:1px solid var(--line); }
    .composer-state { display:flex; align-items:center; gap:8px; margin:0 0 8px; color:var(--muted); font-size:12px; }
    .composer-state strong { color:var(--amber); font-size:13px; }
    .composer-state .state-dot { width:7px; height:7px; background:var(--amber); border-radius:50%; }
    .composer-frame { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; padding:10px 10px 10px 14px; border:1px solid #bfcfe1; border-radius:6px; }
    textarea { width:100%; min-height:48px; max-height:96px; padding:0; resize:vertical; color:var(--ink); background:transparent; border:0; outline:0; line-height:1.6; }
    .continue { align-self:end; min-width:112px; min-height:42px; padding:0 16px; color:#fff; background:var(--blue); border:1px solid var(--blue); border-radius:4px; font-weight:700; }
    .continue:hover { background:#0d49b8; }
    .completed { display:none; margin-top:20px; padding:14px 16px; border-left:3px solid var(--green); background:#f1faf7; }
    .completed.show { display:block; }
    .completed strong { display:block; margin-bottom:4px; color:var(--green); }
    @media (max-width:800px) { .app { display:block; } .side { display:none; } .topbar { height:54px; padding:0 14px; } .workspace { width:100%; height:calc(100dvh - 54px); min-height:0; margin:0; border:0; } .progress { position:relative; align-items:flex-start; gap:8px; padding:9px 104px 9px 14px; } .progress-title { padding-top:4px; } .steps { flex-wrap:wrap; gap:7px 12px; } .step { font-size:12px; } .examples { position:absolute; top:7px; right:8px; } .example-panel { width:min(360px, calc(100vw - 20px)); } .conversation { padding:22px 14px; } .clarification { padding:14px; } .composer { padding:10px 14px 12px; } .composer-frame { gap:8px; } .continue { min-width:96px; } }
  </style>
</head>
<body>
  <div class="app">
    <aside class="side"><div class="brand"><span class="brand-mark">Z</span>知识产权智能服务</div><nav class="nav"><span class="nav-label">咨询</span><span class="nav-item active">知识产权咨询</span><span class="nav-label">检索分析</span><span class="nav-item">专利检索</span><span class="nav-item">商标检索</span><span class="nav-label">资料库</span><span class="nav-item">专利库</span><span class="nav-item">案例库</span></nav></aside>
    <main class="main">
      <header class="topbar">咨询&nbsp;&nbsp;/&nbsp;&nbsp;<strong>知识产权咨询</strong></header>
      <section class="workspace">
        <div class="progress"><span class="progress-title">本次进度</span><div class="steps"><span class="step done">1 输入问题</span><span class="step active">2 补充信息</span><span class="step">3 整理候选</span><span class="step">4 核对回答</span></div><div class="examples"><button type="button" id="examples-button" aria-expanded="false">问题示例</button><div class="example-panel" id="example-panel"><h2>问题示例</h2><button class="example" data-question="查询 CN116234567A 的申请人、发明人和当前状态"><strong>查询专利基本信息</strong><span>查询 CN116234567A 的申请人、发明人和当前状态</span></button><button class="example" data-question="检索与水性粘结剂、双区烘干相关的中国专利"><strong>检索相似专利</strong><span>检索与水性粘结剂、双区烘干相关的中国专利</span></button><button class="example" data-question="对比 CN116234567A 与 CN115987654A 的核心技术特征"><strong>对照两项专利技术</strong><span>对比 CN116234567A 与 CN115987654A 的核心技术特征</span></button></div></div></div>
        <section class="conversation" id="conversation">
          <article class="message"><div class="message-label">咨询助手</div><p class="message-copy">请描述需要查询、检索、比对或参考案例的问题。我会在信息不足时追问，并在可处理时返回可核对的来源依据。</p></article>
          <article class="message user"><div class="message-label">你</div><p class="message-copy">查询 CN116234567A 的申请人、发明人和当前状态</p></article>
          <article class="message clarification"><div class="clarification-head"><div><span class="eyebrow">可选补充</span><h1>补充信息可提高查询匹配度</h1></div><span class="status">可直接继续</span></div><p>可补充以下信息以便聚焦结果；也可以直接按当前问题继续查询。</p><div class="needs"><button class="need active" data-focus="技术条件">技术条件</button><button class="need" data-focus="检索目的">检索目的</button></div></article>
          <article class="completed" id="completed"><strong id="completed-title">已继续查询</strong><span id="completed-detail">正在根据当前问题整理候选与来源。</span></article>
        </section>
        <section class="composer"><div class="composer-state"><span class="state-dot"></span><strong id="mode-label">可选补充</strong><span id="mode-detail">技术条件</span></div><div class="composer-frame"><textarea id="question" rows="2" placeholder="可补充技术对象、关键结构或工艺参数"></textarea><button class="continue" id="continue" type="button">继续查询</button></div></section>
      </section>
    </main>
  </div>
  <script>
    const examplesButton = document.querySelector('#examples-button');
    const examplePanel = document.querySelector('#example-panel');
    const input = document.querySelector('#question');
    const detail = document.querySelector('#mode-detail');
    const needs = document.querySelectorAll('.need');
    examplesButton.addEventListener('click', () => { const open = examplePanel.classList.toggle('open'); examplesButton.setAttribute('aria-expanded', String(open)); });
    document.querySelectorAll('.example').forEach((button) => button.addEventListener('click', () => { input.value = button.dataset.question; examplePanel.classList.remove('open'); examplesButton.setAttribute('aria-expanded', 'false'); input.focus(); }));
    needs.forEach((button) => button.addEventListener('click', () => { needs.forEach((item) => item.classList.remove('active')); button.classList.add('active'); detail.textContent = button.dataset.focus; input.placeholder = button.dataset.focus === '检索目的' ? '请说明用于技术参考、风险初筛或希望重点核对的内容' : '请补充技术对象、关键结构或工艺参数'; input.focus(); }));
    document.querySelector('#continue').addEventListener('click', () => { const hasSupplement = Boolean(input.value.trim()); document.querySelector('#completed-title').textContent = hasSupplement ? '补充信息已收到' : '已按当前问题继续查询'; document.querySelector('#completed-detail').textContent = hasSupplement ? '正在根据补充内容继续整理候选与来源。' : '结果可能不够聚焦，后续仍可继续补充信息。'; document.querySelector('#completed').classList.add('show'); document.querySelector('#conversation').scrollTop = document.querySelector('#conversation').scrollHeight; document.querySelector('#mode-label').textContent = hasSupplement ? '已提交补充' : '正在查询'; document.querySelector('#mode-detail').textContent = ''; });
  </script>
</body>
</html>
